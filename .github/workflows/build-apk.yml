name: Build Galaxy Tunnel APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK with Native Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Download routing assets (geoip.dat and geosite.dat for Bypass mode)
      - name: Download GeoIP and GeoSite routing assets
        run: |
          echo "Downloading latest geoip.dat and geosite.dat..."
          mkdir -p app/src/main/assets
          curl -sL https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat -o app/src/main/assets/geoip.dat || true
          curl -sL https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat -o app/src/main/assets/geosite.dat || true

      # Prepare jniLibs directory for native cores (libv2ray.so / libxray.so)
      - name: Setup Native Xray Core Libraries (jniLibs)
        run: |
          echo "Setting up jniLibs structure for Galaxy Tunnel..."
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64

          # If you have pre-compiled libv2ray.so, place them or fetch from v2rayNG/Xray releases:
          # Example curl to auto-fetch if using a GitHub Release mirror:
          # curl -sL <your_url_to_arm64_libv2ray.so> -o app/src/main/jniLibs/arm64-v8a/libv2ray.so
          echo "jniLibs directories created successfully."

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Build Debug & Release APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Tunnel-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
